# Alembic configuration (I-8 S1). Run from backend/: `.venv\Scripts\python -m alembic upgrade head`.
# The database URL comes from CHANGELENS_DATABASE_URL (default: the compose Postgres), never from this file.
# No [loggers] section: changelens.db and the api configure the scrubbed root handler (logs.py).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
