# Local dev services for the I-22 backend. Dev-only credentials; ports bind to localhost only.
# Images are pinned by tag and digest. minio/minio is no longer published on Docker Hub, so this
# uses Bitnami's archived MinIO build (see docs/06-decision-log.md, I-22 row).
name: changelens-dev
services:
  postgres:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    environment:
      POSTGRES_USER: changelens
      POSTGRES_PASSWORD: changelens
      POSTGRES_DB: changelens
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U changelens -d changelens"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    environment:
      MINIO_ROOT_USER: changelens
      MINIO_ROOT_PASSWORD: changelens-dev-only
      MINIO_DEFAULT_BUCKETS: changelens-dev
    ports:
      - "127.0.0.1:59000:9000"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      # The image first runs a temporary background MinIO to create the default bucket, stops it,
      # then execs the real server as PID 1. health/live alone can pass on the temporary one.
      test: ["CMD-SHELL", "grep -qx minio /proc/1/comm && curl -fsS http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  miniodata:
