# Codemagic CI for the ChangeLens Flutter apps: the real app in app/ (I-9, dev.changelens.app) and
# the D-15 proof of concept in poc/d15/app.
# Owner decision 2026-10-31 (06): Android first, iOS on the owner's Mac plus a cloud macOS build.
# Flutter is pinned to the version used locally; bump it here and locally together.
definitions:
  app: &app
    working_directory: poc/d15/app
    max_build_duration: 30
    instance_type: mac_mini_m2
  flutter: &flutter
    flutter: 3.47.9
    xcode: latest
    cocoapods: default
  cache: &cache
    cache_paths:
      - $HOME/.pub-cache
      - $HOME/.gradle/caches
  on_app_change: &on_app_change
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    when:
      changeset:
        includes:
          - 'poc/d15/app/'
          - 'codemagic.yaml'
  real_app: &real_app
    working_directory: app
    max_build_duration: 30
    instance_type: mac_mini_m2
  on_real_app_change: &on_real_app_change
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    when:
      changeset:
        includes:
          - 'app/'
          - 'codemagic.yaml'
          - 'scripts/release/'
  scripts:
    - &pub_get
      name: Get packages
      script: flutter pub get
    - &analyze
      name: Analyze
      script: flutter analyze
    - &unit_tests
      name: Unit tests
      script: flutter test
    - &release_config
      name: Check real-app release configuration
      script: python3 "$CM_BUILD_DIR/scripts/release/check_config.py"

workflows:
  # The real app (I-9): analyze, test and build on every push that touches app/.
  app-android-check:
    name: App Android check
    <<: [*real_app, *on_real_app_change]
    environment:
      <<: *flutter
    cache: *cache
    scripts:
      - *release_config
      - *pub_get
      - *analyze
      - *unit_tests
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - $CM_BUILD_DIR/app/build/app/outputs/flutter-apk/*.apk

  app-ios-compile-check:
    name: App iOS compile check (unsigned)
    <<: [*real_app, *on_real_app_change]
    environment:
      <<: *flutter
    cache: *cache
    scripts:
      - *release_config
      - *pub_get
      - *analyze
      - *unit_tests
      - name: Build iOS without code signing
        script: flutter build ios --release --no-codesign

  # Every push that touches the app: analyze, test and build a debug APK.
  android-check:
    name: Android check
    <<: [*app, *on_app_change]
    environment:
      <<: *flutter
    cache: *cache
    scripts:
      - *pub_get
      - *analyze
      - *unit_tests
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - $CM_BUILD_DIR/poc/d15/app/build/app/outputs/flutter-apk/*.apk

  # Every push that touches the app: prove the iOS build compiles. Unsigned, so it needs no
  # Apple Developer account and produces nothing installable.
  ios-compile-check:
    name: iOS compile check (unsigned)
    <<: [*app, *on_app_change]
    environment:
      <<: *flutter
    cache: *cache
    scripts:
      - *pub_get
      - *analyze
      - *unit_tests
      - name: Build iOS without code signing
        script: flutter build ios --release --no-codesign

  # Manual signed artifact preparation only. No publishing is configured: inspect the exact
  # artifact on a device and run scripts/release/check_acceptance.py before external distribution.
  app-android-release:
    name: App Android signed release
    <<: *real_app
    environment:
      <<: *flutter
      android_signing:
        - changelens_release
    cache: *cache
    scripts:
      - *release_config
      - *pub_get
      - *analyze
      - *unit_tests
      - name: Build signed Android artifacts
        script: |
          set -eu
          flutter build apk --release --build-number=$BUILD_NUMBER
          flutter build appbundle --release --build-number=$BUILD_NUMBER
    artifacts:
      - $CM_BUILD_DIR/app/build/app/outputs/flutter-apk/*-release.apk
      - $CM_BUILD_DIR/app/build/app/outputs/bundle/release/*.aab

  # Requires signing identities for dev.changelens.app and the named Apple integration.
  ios-testflight:
    name: App signed IPA for TestFlight (prepare only)
    <<: *real_app
    integrations:
      app_store_connect: ChangeLens App Store Connect
    environment:
      <<: *flutter
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dev.changelens.app
    cache: *cache
    scripts:
      - *release_config
      - *pub_get
      - *analyze
      - *unit_tests
      - name: Apply real-app signing profiles
        script: xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build real-app IPA
        script: flutter build ipa --release --build-number=$BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - $CM_BUILD_DIR/app/build/ios/ipa/*.ipa

  # Owner device checks (M1): an ad hoc IPA signed for devices registered in the Apple Developer
  # portal, installed from Codemagic's install link. Nothing is uploaded to App Store Connect.
  # The app's API URL is set on the device (developer settings), e.g. the PC's Wi-Fi address.
  ios-device-check:
    name: App ad hoc IPA for owner device checks
    <<: *real_app
    integrations:
      app_store_connect: ChangeLens App Store Connect
    environment:
      <<: *flutter
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: dev.changelens.app
    cache: *cache
    scripts:
      - *release_config
      - *pub_get
      - *analyze
      - *unit_tests
      - name: Apply ad hoc signing profiles
        script: xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build ad hoc IPA
        script: flutter build ipa --release --build-number=$BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - $CM_BUILD_DIR/app/build/ios/ipa/*.ipa

  # The D-15 proof of concept remains separate and is never real-app acceptance evidence.
  poc-ios-testflight:
    name: PoC signed IPA for TestFlight (prepare only)
    <<: *app
    integrations:
      app_store_connect: ChangeLens App Store Connect
    environment:
      <<: *flutter
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dev.changelens.changelensPoc
    cache: *cache
    scripts:
      - *pub_get
      - *analyze
      - *unit_tests
      - name: Apply signing profiles
        script: xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build IPA
        script: flutter build ipa --release --build-number=$BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - $CM_BUILD_DIR/poc/d15/app/build/ios/ipa/*.ipa
