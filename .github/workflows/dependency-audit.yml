name: dependency-audit

# Known-vulnerability audit of every hash-pinned Python requirements file (pip-audit, PyPI advisory data).
# Secret scanning is not repeated here: the GitGuardian app already checks every push.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 1'  # Mondays 05:17 UTC: new advisories arrive without a commit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # Same runner and interpreter as plan-checks: scripts/ci/requirements-audit.txt pins wheels for it.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # same pin as plan-checks
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # same pin as plan-checks
        with:
          python-version: '3.14.10'
          architecture: 'x64'
      - name: Install the pinned audit tool in its own venv
        shell: powershell
        run: |
          python -m venv .audit-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.audit-venv/Scripts/python.exe -m pip install --disable-pip-version-check --require-hashes -r scripts/ci/requirements-audit.txt
          exit $LASTEXITCODE
      # Every file is audited even when an earlier one has a finding, so one run lists them all.
      # A known vulnerability in any of them fails the job; fix it by bumping the pin and running
      # scripts/ci/pin_hashes.py (see docs/SOP.md).
      - name: Audit the production, test, evaluation and audit-tool pins
        shell: powershell
        run: |
          $failed = 0
          foreach ($f in 'backend/requirements.txt', 'backend/requirements-test.txt', 'scripts/eval/requirements-render.txt', 'scripts/ci/requirements-audit.txt') {
            Write-Host "== $f"
            ./.audit-venv/Scripts/python.exe -m pip_audit --require-hashes --disable-pip --progress-spinner off -r $f
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
          }
          exit $failed
