name: backend-integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    # Development's integration checks stay independent of the separate release-quality gate.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      COMPOSE_PROJECT_NAME: changelens-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # same pin as plan-checks
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # same pin as plan-checks
        with:
          python-version: '3.10.11'
          architecture: 'x64'
      - name: Install existing hashed backend requirements
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Test the integration-report gate offline
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Start isolated pinned integration services
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" --file backend/docker-compose.yml up --detach --wait --wait-timeout 180
      - name: Run every backend integration test
        id: integration
        run: backend/.venv/bin/python -m pytest backend/tests/integration -q -rs -c backend/pytest.ini --junitxml="$RUNNER_TEMP/changelens-integration.xml"
      - name: Require executed tests with no skips or failures
        if: always()
        run: python scripts/ci/check_integration_result.py "$RUNNER_TEMP/changelens-integration.xml"
      - name: Remove only this run's integration resources
        if: always()
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" --file backend/docker-compose.yml down --volumes --remove-orphans

  release-readiness:
    # Manual evidence check only. The committed failed I-7 receipt is expected to block this job.
    # This is not a deployment job and does not claim signing, device, privacy or launch readiness.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # same pin as plan-checks
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # same pin as plan-checks
        with:
          python-version: '3.10.11'
          architecture: 'x64'
      - name: Install existing hashed backend requirements
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Check offline release-quality evidence
        working-directory: backend
        run: .venv/bin/python -m tools.release_gate
