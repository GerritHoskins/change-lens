name: plan-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned by SHA (03 §6)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, verified 2026-10-31
        with:
          python-version: '3.14.10'
          architecture: 'x64'
      - name: Install pinned render dependencies in the project venv
        shell: powershell
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip install --disable-pip-version-check --require-hashes -r scripts/eval/requirements-render.txt
          exit $LASTEXITCODE
      - name: Build and test the plan
        shell: powershell
        run: ./scripts/ci.ps1
