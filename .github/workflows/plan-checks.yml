name: plan-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2, pinned by SHA (03 §6)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.3.0, verified 2026-10-31
        with:
          python-version: '3.14.10'
          architecture: 'x64'
      - name: Install pinned render dependencies in the project venv
        shell: powershell
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip install --disable-pip-version-check --require-hashes -r scripts/eval/requirements-render.txt
          exit $LASTEXITCODE
      - name: Build and test the plan
        shell: powershell
        run: ./scripts/ci.ps1
