name: uptime

# Outside check of the IONOS deployment (runbook D3, launch task L17). deploy/ionos/monitor.sh runs on the
# server it watches, so it can't report the server itself being down; this runs on GitHub's runners.
# It sends two unauthenticated GET requests and nothing else: no token, no user data.
# A failed run mails the person who last changed the schedule below (GitHub notification setting
# "Actions: send notifications for failed workflows only").
# Limits: GitHub starts scheduled runs late under load (often 10 to 20 minutes), runs them only from the
# default branch, and pauses the schedule after 60 days without a commit in a public repository.
on:
  schedule:
    - cron: '7-59/10 * * * *'  # every 10 minutes, off the busy full hour
  workflow_dispatch:

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The API refuses a request without a token and Logto serves its OpenID configuration
        shell: bash
        run: |
          # Three tries, 30 seconds apart, so one dropped connection doesn't raise an alert.
          check() {
            local want="$1" url="$2" code=""
            for try in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || true)
              if [ "$code" = "$want" ]; then
                echo "ok   $url answered $code"
                return 0
              fi
              echo "try $try: $url answered ${code:-nothing}, expected $want"
              [ "$try" -lt 3 ] && sleep 30
            done
            echo "::error::$url answered ${code:-nothing}, expected $want"
            return 1
          }
          failed=0
          check 401 https://api.pixeltronic.dev/projects || failed=1
          check 200 https://auth.pixeltronic.dev/oidc/.well-known/openid-configuration || failed=1
          exit $failed
