# Egress proxy for the worker (03 §6: the worker's outbound network is the model API and storage only).
# The worker sits on an internal network with no route out; HTTPS through this proxy is allowed to the
# host names in /etc/squid/allowlist.txt (mounted from /etc/changelens/egress-allowlist.txt) and nothing
# else. Only CONNECT to port 443 is allowed, so the proxy never sees request bodies.
http_port 3128

acl allowed dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed
http_access deny all

cache deny all
cache_mem 8 MB
max_filedescriptors 1024
# Host names and status only (CONNECT carries no request content in clear text). Squid can't write to the
# container's stdout as its unprivileged user, so the log is a file: docker compose exec egress tail
# /var/log/squid/access.log. It resets when the container is recreated.
access_log daemon:/var/log/squid/access.log squid
pid_filename none
