# ChangeLens on one IONOS Cloud Cube (I-8 S7). Runbook: README.md in this folder.
# Every image is pinned by tag and digest. No secret is in this file: each service reads its own env file
# from /etc/changelens/ (root-only, created from the *.env.example files here). Nothing but Caddy listens on a
# public port; the Logto admin console is on the host's loopback only (reach it through an SSH tunnel).
#
# Networks:
#   edge     Caddy, the api, Logto, retention. Outbound internet (Logto's SMTP, JWKS, object storage).
#            Caddy also answers as auth.pixeltronic.dev here, so processes reach Logto's public URL directly.
#   data     internal, no internet: Postgres and the ChangeLens processes that talk to it.
#   authdb   internal, no internet: Postgres and Logto only. Logto is not on `data`, so the worker has no
#            route to Logto (03 §6, LR-4); the api and retention reach it through Caddy on `edge`.
#   outbound the egress proxy and the backup job: the only way out for the worker is the proxy's allow-list.
#   statsdb  internal, no internet: Postgres and Umami only (profile `stats`).
#   stats    Caddy and Umami only; not internal, so Umami's dashboard port can be bound to the host's loopback.
name: changelens

x-app: &app
  build:
    context: ../../backend
    dockerfile: ../deploy/ionos/changelens.Dockerfile
  image: changelens-backend:local
  env_file: /etc/changelens/changelens.env
  read_only: true
  tmpfs:
    - /tmp:size=512m
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: /etc/changelens/caddy.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./brand:/srv/changelens-brand:ro
      - ../../web:/srv/changelens-web:ro  # the landing page
      # The landing page's access log, on the host so root's cron can total it (landing-stats.py).
      - /var/log/changelens-caddy:/var/log/caddy
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.30.0.2  # = CHANGELENS_TRUSTED_PROXIES
        aliases:
          - auth.pixeltronic.dev
          - api.pixeltronic.dev
      stats:
        ipv4_address: 172.30.6.2  # = Umami's TRUSTED_PROXIES
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:16.16-alpine@sha256:0adbf25a9e96d38823bb813f3ac0ed41fadb665c88f1df7fe6dbfb060cbdc106
    env_file: /etc/changelens/postgres.env
    # A new volume mounts root-owned; the archive directory must belong to postgres (uid 70, as in the backup
    # image) before the server starts.
    entrypoint: ["sh", "-c", "chown postgres:postgres /wal-archive && chmod 700 /wal-archive && exec docker-entrypoint.sh \"$$@\"", "postgres-entrypoint"]
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/.%f.tmp && mv /wal-archive/.%f.tmp /wal-archive/%f
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic  # never log the failing statement or its parameters (AC-23)
      - -c
      - log_error_verbosity=terse  # no DETAIL or CONTEXT lines: they can quote a key value or a JSON fragment (LR-5)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal-archive:/wal-archive
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data, authdb, statsdb]
    shm_size: 256m
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d changelens"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  logto:
    image: svhd/logto:1.45.0@sha256:9a9aff9423ab7863f00c881c31408e0bfe4def730bac2182d0097367002f5854
    # Logto prints every request line with its query string, which carries the email address and the one-time
    # sign-in token (LR-12). logto/start.sh sends the output through logto/log-filter.awk, which drops those
    # before Docker stores the line.
    entrypoint: ["sh", "/usr/local/share/changelens/start.sh"]
    volumes:
      - ./logto:/usr/local/share/changelens:ro
    env_file: /etc/changelens/logto.env
    environment:
      TRUST_PROXY_HEADER: "1"
      ENDPOINT: https://auth.pixeltronic.dev
      ADMIN_ENDPOINT: http://localhost:3002
    ports:
      - "127.0.0.1:3002:3002"  # admin console: SSH tunnel only
    networks: [edge, authdb]
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/status >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped
    logging: *logging

  api:
    <<: *app
    # --lan binds 0.0.0.0 inside the container; only Caddy can reach it (no published port). Its startup
    # line warns about the dev token, which doesn't apply in logto mode (README, known gaps).
    command: ["python", "-m", "changelens.api", "--port", "8000", "--lan"]
    volumes: &signin
      # Google and Apple sign-in secrets as files (README C8); an empty folder while sign-in is off.
      - /etc/changelens/signin:/run/signin:ro
    networks: [edge, data]
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      logto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    <<: *app
    command: ["python", "-m", "changelens.worker"]
    # Its own file, without the Logto Management credential and the rate-limit key (03 §6, LR-4): the worker
    # parses uploaded files, and it stops at start when it is given one of them.
    env_file: /etc/changelens/worker.env
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      # The worker has no route to the internet; the proxy lets through the model API and storage only.
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      NO_PROXY: postgres,localhost,127.0.0.1
    networks: [data]
    mem_limit: 2g

  retention:
    <<: *app
    command: ["python", "-m", "changelens.retention", "--apply", "--interval-seconds", "60"]
    volumes: *signin  # revokes Apple tokens (deleted accounts, expired parked tokens)
    networks: [edge, data]
    mem_limit: 512m

  egress:
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      - /etc/changelens/egress-allowlist.txt:/etc/squid/allowlist.txt:ro
    networks: [data, outbound]
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  backup:
    build: ./backup
    image: changelens-backup:local
    env_file: /etc/changelens/backup.env
    volumes:
      - wal-archive:/wal-archive
      - backup-work:/work
    networks: [data, outbound]
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # Umami: visits and click events for the landing page (docs/landing-page-handoff.md, Measurement). Off
  # unless the `stats` profile is named: docker compose --profile stats up -d umami. It stays off until the
  # legal review has answered whether the tracker may run without consent.
  # Caddy passes on /umami/script.js and /umami/api/send only; the dashboard is on the host's loopback
  # (SSH tunnel), like Logto's admin console.
  umami:
    image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
    profiles: [stats]
    env_file: /etc/changelens/umami.env  # DATABASE_URL and APP_SECRET; Umami stops at start without them
    environment:
      # Set here, not in the env file: any value of SALT_ROTATION that Umami doesn't know becomes a salt that
      # never rotates, so a typo would silently turn the daily rotation off.
      SALT_ROTATION: day
      TRUSTED_PROXIES: 172.30.6.2  # Caddy on `stats`: the visitor's address is taken from its header only
      PRIVATE_MODE: "1"  # no outside calls at all (telemetry, version check, site icons)
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
    ports:
      - "127.0.0.1:3003:3000"  # dashboard: SSH tunnel only
    networks: [stats, statsdb]
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  # One-off tools: docker compose --profile tools run --rm <name>
  bootstrap-roles:
    <<: *app
    profiles: [tools]
    env_file: /etc/changelens/admin.env
    command: ["python", "-m", "changelens.db", "bootstrap-roles"]
    networks: [data]
    restart: "no"

  migrate:
    <<: *app
    profiles: [tools]
    env_file: /etc/changelens/admin.env
    command: ["python", "-m", "alembic", "upgrade", "head"]
    networks: [data]
    restart: "no"

  # The early-bird list as CSV on stdout, for a mail to it (backend/README.md §14):
  #   docker compose --profile tools run --rm -T early-bird-export > /root/early-bird-list.csv
  # The only reader of the list's addresses. It connects as the owner role (admin.env); the public API URL and
  # the unsubscribe key for the removal links come from changelens.env, the one place the api reads them from,
  # so an exported link can't be signed with another key than the api checks.
  early-bird-export:
    <<: *app
    profiles: [tools]
    env_file:
      - /etc/changelens/admin.env
      - /etc/changelens/changelens.env
    command: ["python", "-m", "changelens.early_bird_export"]
    networks: [data]
    restart: "no"
    logging:
      driver: none  # its output is the address list: never into Docker's log files

  restore-test:
    image: changelens-backup:local
    profiles: [tools]
    env_file: /etc/changelens/backup.env
    entrypoint: ["/usr/local/bin/restore.sh"]
    volumes:
      - restore-data:/restore
      - /etc/changelens/backup-identity.txt:/run/backup-identity.txt:ro
    networks: [outbound]
    restart: "no"

networks:
  authdb:
    internal: true
  statsdb:
    internal: true
  stats:
    ipam:
      config:
        - subnet: 172.30.6.0/24
          ip_range: 172.30.6.128/25  # as on `edge`: dynamic addresses can't take Caddy's fixed one
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Dynamic addresses come from the upper half only, so a container started while Caddy is down can't
          # take Caddy's fixed 172.30.0.2 ("Address already in use" on the next start).
          ip_range: 172.30.0.128/25
  data:
    internal: true
  outbound: {}

volumes:
  caddy-data:
  caddy-config:
  pgdata:
  wal-archive:
  backup-work:
  restore-data:
